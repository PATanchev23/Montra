<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Montra — cash-flow management for e-commerce businesses" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Montra</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        // Light is the default. A "dark" saved before version 1 (or with no version) was
        // the old default, so it starts from light once; the store in src/stores/ui.ts
        // applies the same rule.
        var saved = JSON.parse(localStorage.getItem('montra-ui') || '{}');
        var version = typeof saved.version === 'number' ? saved.version : 0;
        var pref = (saved.state && saved.state.theme) || 'light';
        if (version < 1 && pref === 'dark') pref = 'light';
        var dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
